name: Patch Related Articles integration

on:
  push:
    branches:
      - audit-related-8
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch static article generator
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/generate-static-articles.yml';
          let text = fs.readFileSync(path, 'utf8');
          const needle = '<script src="../assets/js/main.js" defer></script>';
          const replacement = '<script src="../assets/js/main.js" defer></script><script src="../assets/js/related-articles.js" defer></script>';
          if (!text.includes(needle)) throw new Error('Static article script anchor not found.');
          if (!text.includes('../assets/js/related-articles.js')) {
            text = text.replace(needle, replacement);
            fs.writeFileSync(path, text);
          }
          NODE

      - name: Patch existing static pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          if (fs.existsSync('articles')) {
            for (const name of fs.readdirSync('articles')) {
              if (!name.endsWith('.html')) continue;
              const p = `articles/${name}`;
              let text = fs.readFileSync(p, 'utf8');
              const anchor = '<script src="../assets/js/main.js" defer></script>';
              const script = '<script src="../assets/js/related-articles.js" defer></script>';
              if (text.includes(anchor) && !text.includes(script)) {
                text = text.replace(anchor, `${anchor}${script}`);
                fs.writeFileSync(p, text);
              }
            }
          }
          NODE

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/generate-static-articles.yml articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate related articles into static pages"
          git push
