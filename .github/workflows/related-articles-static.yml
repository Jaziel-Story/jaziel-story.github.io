name: Integrate Related Articles into static pages

on:
  push:
    paths:
      - "articles/*.html"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add related articles script to generated pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const dir = 'articles';
          const anchor = '<script src="../assets/js/main.js" defer></script>';
          const script = '<script src="../assets/js/related-articles.js" defer></script>';
          let changed = false;
          if (fs.existsSync(dir)) {
            for (const name of fs.readdirSync(dir)) {
              if (!name.endsWith('.html')) continue;
              const path = `${dir}/${name}`;
              let html = fs.readFileSync(path, 'utf8');
              if (html.includes(anchor) && !html.includes(script)) {
                html = html.replace(anchor, `${anchor}${script}`);
                fs.writeFileSync(path, html);
                changed = true;
              }
            }
          }
          if (!changed) process.exit(0);
          NODE

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Integrate related articles into static pages"
          git push
