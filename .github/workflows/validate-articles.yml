name: Validate articles.json

on:
  push:
    paths:
      - "articles.json"
  pull_request:
    paths:
      - "articles.json"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate schema
        run: node .github/scripts/validate-articles.mjs
