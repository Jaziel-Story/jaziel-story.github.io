name: Fix preview cover

on:
  push:
    branches:
      - fix-preview-cover

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview cover handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/admin.js')
          s = p.read_text()
          old = '''function articlePreviewHTML(article) {
  const meta = [article.readTime, formatDate(article.date)].filter(Boolean).join(" · ");
  const dek = article.dek || article.description || "";
  const coverHTML = article.cover
    ? `<div class="article-cover"><img src="${escapeHTML(coverUrlFor(article.cover))}" alt="${escapeHTML(article.title || "")}"></div>`
    : "";'''
          new = '''function articlePreviewHTML(article) {
  const meta = [article.readTime, formatDate(article.date)].filter(Boolean).join(" · ");
  const dek = article.dek || article.description || "";

  // Preview must also show a newly selected cover before Publish has uploaded
  // it to GitHub. In that state article.cover is intentionally empty and the
  // real File object lives in state.pendingCoverFile.
  const previewCoverUrl = article.cover
    ? coverUrlFor(article.cover)
    : (state.pendingCoverFile ? URL.createObjectURL(state.pendingCoverFile) : "");
  const coverHTML = previewCoverUrl
    ? `<div class="article-cover"><img src="${escapeHTML(previewCoverUrl)}" alt="${escapeHTML(article.title || "")}"></div>`
    : "";'''
          if old not in s:
              raise SystemExit('Expected articlePreviewHTML cover block was not found; refusing to patch.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/admin.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix cover image in article preview"
          git push
