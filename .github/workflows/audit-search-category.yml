name: Audit Search Category

on:
  push:
    paths:
      - '.github/workflows/audit-search-category.yml'
      - '.github/trigger-search-category'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch search and category behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'assets/js/main.js';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(
`    const matches = searchArticles(articles, query);`,
`    const matches = searchArticles(articles, query);`
          );

          s = s.replace(
`  if (form) {
    form.addEventListener("submit", event => {
      event.preventDefault();
      const query = (input && input.value ? input.value : "").trim();
      const newUrl = query ? searchUrl(query) : "search.html";
      window.history.pushState({}, "", newUrl);
      runSearch(query);
    });
  }
}`,
`  if (form) {
    form.addEventListener("submit", event => {
      event.preventDefault();
      const query = normalizeSearchQuery(input && input.value ? input.value : "");
      const newUrl = query ? searchUrl(query) : "search.html";
      window.history.pushState({}, "", newUrl);
      runSearch(query);
    });
  }

  window.addEventListener("popstate", () => {
    runSearch(normalizeSearchQuery(getQueryParam("q") || ""));
  });
}`
          );

          s = s.replace(
`function searchArticles(articles, query) {
  const q = query.toLowerCase();

  return articles.filter(article => {
    const haystacks = [
      article.title,
      article.description,
      article.dek,
      article.category,
      ...(Array.isArray(article.tags) ? article.tags : [])
    ];

    return haystacks.some(value => (value || "").toLowerCase().includes(q));
  });
}`,
`function normalizeSearchQuery(value) {
  return String(value || "").trim().replace(/\\s+/g, " ");
}

function searchArticles(articles, query) {
  const q = normalizeSearchQuery(query).toLocaleLowerCase();

  return articles
    .filter(article => {
      const sectionText = Array.isArray(article.sections)
        ? article.sections.flatMap(section => [
            section && section.heading,
            ...(section && Array.isArray(section.paragraphs) ? section.paragraphs : [])
          ])
        : [];

      const haystacks = [
        article.title,
        article.description,
        article.dek,
        article.intro,
        article.category,
        article.closing,
        ...(Array.isArray(article.tags) ? article.tags : []),
        ...sectionText
      ];

      return haystacks.some(value =>
        String(value || "").toLocaleLowerCase().includes(q)
      );
    })
    .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
}`
          );

          s = s.replace(
`  const initialQuery = (getQueryParam("q") || "").trim();`,
`  const initialQuery = normalizeSearchQuery(getQueryParam("q") || "");`
          );

          s = s.replace(
`  const matches = articles.filter(
    a => (a.category || "").toLowerCase() === category.toLowerCase()
  );

  if (heading) heading.textContent = category;`,
`  const normalizedCategory = normalizeCategory(category);
  const matchedCategory = categories.find(
    cat => normalizeCategory(cat) === normalizedCategory
  );
  const matches = articles
    .filter(a => normalizeCategory(a.category) === normalizedCategory)
    .sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  if (heading) heading.textContent = matchedCategory || category;`
          );

          s = s.replace(
`function uniqueCategories(articles) {
  return [...new Set(articles.map(a => a.category).filter(Boolean))].sort();
}`,
`function normalizeCategory(value) {
  return String(value || "").trim().toLocaleLowerCase();
}

function uniqueCategories(articles) {
  const seen = new Set();
  return articles
    .map(a => String(a.category || "").trim())
    .filter(category => {
      const key = normalizeCategory(category);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => a.localeCompare(b));
}`
          );

          s = s.replace(
`function categoryUrl(category) {
  return \`category.html?category=\${encodeURIComponent(category)}\`;
}

function searchUrl(query) {
  return \`search.html?q=\${encodeURIComponent(query)}\`;
}`,
`function categoryUrl(category) {
  return \`/category.html?category=\${encodeURIComponent(String(category || "").trim())}\`;
}

function searchUrl(query) {
  return \`/search.html?q=\${encodeURIComponent(normalizeSearchQuery(query))}\`;
}`
          );

          s = s.replace(
`function articleUrl(article) {
  if (!article || !article.slug) return "#";
  return \`articles/\${encodeURIComponent(article.slug)}.html\`;
}`,
`function articleUrl(article) {
  if (!article || !article.slug) return "#";
  return \`/articles/\${encodeURIComponent(article.slug)}.html\`;
}`
          );

          fs.writeFileSync(path, s);
          NODE

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/main.js
          git diff --cached --quiet || git commit -m "Improve search and category handling"
          git push
