name: Jaziel prioritized audit repair
on:
  push:
    paths: [".github/workflows/repair-audit.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix cover compression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('assets/js/image-compressor.js'); s=p.read_text()
          new='''async function compressCover(file) {
            if (!file) return file;
            const source = await loadImage(file);
            let width = OG_WIDTH;
            let height = OG_HEIGHT;
            let best = null;
            for (let pass = 0; pass < 6; pass++) {
              const canvas = document.createElement("canvas");
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext("2d", { alpha: false });
              if (!ctx) throw new Error("Canvas is unavailable in this browser.");
              ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
              ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, width, height);
              drawCoverCrop(ctx, source, width, height);
              for (const quality of [0.84,0.76,0.68,0.60,0.52,0.44,0.38,0.32,0.28]) {
                best = await canvasBlob(canvas, "image/jpeg", quality);
                if (best.size <= OG_TARGET_BYTES) break;
              }
              if (best && best.size <= OG_TARGET_BYTES) break;
              if (Math.max(width,height) <= 800) break;
              width=Math.max(800,Math.round(width*0.85));
              height=Math.max(420,Math.round(height*0.85));
            }
            if (typeof source.close === "function") source.close();
            if (!best) throw new Error("OG cover compression failed.");
            return makeFile(best, file.name, "jpg", "image/jpeg");
          }'''
          s,n=re.subn(r'async function compressCover\(file\) \{.*?\n\}',new,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('compressCover not found')
          s=s.replace('if (!/^image\\/(jpeg|png|webp|gif)$/.test(file.type) || file.type === "image/gif") return;','if (!/^image\\/(jpeg|png|webp|gif)$/.test(file.type)) return;')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "jaziel-repair[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/image-compressor.js
          git commit -m "Fix social cover compression" || exit 0
          git push
