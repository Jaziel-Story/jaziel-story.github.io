name: Jaziel prioritized audit repair

on:
  push:
    paths:
      - ".github/scripts/repair-audit.mjs"
      - ".github/workflows/repair-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply prioritized fixes
        run: node .github/scripts/repair-audit.mjs
      - name: Commit fixes
        run: |
          git config user.name "jaziel-repair[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix prioritized Jaziel audit issues"
            git push
          fi
