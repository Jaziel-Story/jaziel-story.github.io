<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search trending stories on Jaziel.">
  <meta name="theme-color" content="#111111">
  <title>Search | Jaziel</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/main.js" defer></script>
</head>

<body data-page="search">
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">JAZIEL</a>

      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Search">⌕</button>
      </div>
    </div>
  </header>

  <main>
    <div class="container">

      <section class="page-header">
        <h1>Search Jaziel</h1>
        <p>Find stories by title, category or tag.</p>
      </section>

      <form class="search-box" id="search-form" role="search">
        <input
          type="search"
          id="search-input"
          name="q"
          placeholder="Search stories…"
          aria-label="Search stories">
        <button type="submit">Search</button>
      </form>

      <p class="status-text" id="search-status"></p>

      <div class="ad-slot" aria-label="Advertisement"></div>

      <div class="story-list" id="search-results"></div>

      <div class="ad-slot" aria-label="Advertisement"></div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="footer-logo">JAZIEL</div>
        <div>Trending stories, viral moments and news from around the world.</div>
      </div>

      <div class="footer-links">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>

      <div>© 2026 Jaziel. All rights reserved.</div>
    </div>
  </footer>
</body>
</html>
